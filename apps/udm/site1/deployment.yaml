apiVersion: apps/v1
kind: Deployment
metadata:
  name: udm-argocd-deploy
  namespace: udm-cnf1
  labels:
    app: udm
    site: site1
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: udm
  template:
    metadata:
      labels:
        app: udm
        site: site1
    spec:
      containers:
        - name: udm-container
          image: raniayousfi11/pfe-cnf-app:93a2a94
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
