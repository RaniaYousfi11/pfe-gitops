apiVersion: apps/v1
kind: Deployment
metadata:
  name: udm-argocd-deploy
  namespace: udm-cnf1
  labels:
    app: udm
    site: site3
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: udm
  template:
    metadata:
      labels:
        app: udm
        site: site3
    spec:
      containers:
        - name: udm-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
