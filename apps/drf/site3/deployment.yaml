apiVersion: apps/v1
kind: Deployment
metadata:
  name: drf-argocd-deploy
  namespace: drf-cnf1
  labels:
    app: drf
    site: site3
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drf
  template:
    metadata:
      labels:
        app: drf
        site: site3
    spec:
      containers:
        - name: drf-container
          image: raniayousfi11/pfe-cnf-app:f53115e
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
