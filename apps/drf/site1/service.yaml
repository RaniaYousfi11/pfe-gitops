apiVersion: v1
kind: Service
metadata:
  name: drf-argocd-clusterip
  namespace: drf-cnf1
  labels:
    app: drf
    type: internal-lb
    managed-by: argocd
spec:
  selector:
    app: drf
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: drf-argocd-nodeport
  namespace: drf-cnf1
  labels:
    app: drf
    type: external-access
    managed-by: argocd
spec:
  selector:
    app: drf
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
  type: NodePort
