apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfe-infra-root
  namespace: argocd
  labels:
    project: pfe
    type: app-of-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RaniaYousfi11/pfe-gitops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
