apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: udm-site2
  namespace: argocd
  labels:
    product: udm
    site: site2
    managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RaniaYousfi11/pfe-gitops.git
    targetRevision: main
    path: apps/udm/site2
  destination:
    name: site2
    namespace: udm-cnf1
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
